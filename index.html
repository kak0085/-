<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英検対策 一問一答</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{width:min(100%,600px);margin:auto;padding:18px 14px 35px}
h1{font-size:23px;margin:4px 0 12px;text-align:center}
.desc{font-size:14px;color:#666;margin-bottom:16px;text-align:center}

/* タブナビゲーション */
.tab-nav{display:flex;background:#e5e7eb;padding:4px;border-radius:14px;margin-bottom:16px}
.tab-btn{flex:1;height:42px;border:0;background:transparent;border-radius:10px;font-size:15px;font-weight:600;color:#666;cursor:pointer;transition:.2s}
.tab-btn.active{background:#fff;color:#111;box-shadow:0 2px 6px #00000012}

.card{background:#fff;border-radius:18px;padding:20px 17px;box-shadow:0 2px 12px #00000012;margin-bottom:15px}
.top{display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:8px}
.track{height:7px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin-bottom:24px}
.fill{height:100%;width:0;background:#111;transition:.2s}
.question{text-align:center;min-height:145px;display:flex;flex-direction:column;justify-content:center}
.jp{font-size:32px;font-weight:700;line-height:1.35}
.pos{display:inline-block;margin:10px auto 0;padding:5px 10px;border-radius:8px;background:#eee;color:#555;font-size:14px}
input[type="text"], input[type="password"], textarea, select{display:block;width:100%;border:2px solid #ddd;border-radius:12px;padding:10px 14px;font-size:16px;outline:0}
input[type="text"], input[type="password"]{height:54px;font-size:20px}
input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus{border-color:#555}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
button{height:50px;border:0;border-radius:11px;font-size:16px;font-weight:600;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.primary{background:#111;color:#fff}
.secondary{background:#e9eaec;color:#111}
.feedback{min-height:58px;margin-top:12px;padding:12px;border-radius:11px;font-size:15px;line-height:1.5}
.good{background:#e9f7ec}
.bad{background:#fff0f0}
.answer{font-size:21px;font-weight:700}
.stats{display:flex;justify-content:space-between;margin-top:12px;color:#777;font-size:13px}
.result{text-align:center;padding:32px 18px}
.score{font-size:48px;font-weight:800;margin:15px 0}
.hidden{display:none !important}

/* パスワード保護用 */
.auth-card{text-align:center;padding:30px 20px}
.auth-title{font-size:20px;font-weight:700;margin-bottom:10px}
.auth-desc{font-size:14px;color:#666;margin-bottom:20px}
.auth-error{color:#ef4444;font-size:13px;margin-top:10px;min-height:20px}

/* モード切替エリア */
.mode-select{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#444;font-weight:bold}
.mode-select select{width:auto;height:40px;padding:0 10px;font-size:14px}

/* 写真別データ管理エリア */
.manage-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.image-list{display:flex;flex-direction:column;gap:10px}
.image-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.image-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff}
.image-info{display:flex;flex-direction:column;gap:2px;overflow:hidden;padding-right:8px;cursor:pointer}
.image-name{font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-meta{font-size:12px;color:#666}
.action-btns{display:flex;gap:6px;align-items:center}
.btn-del{height:34px;padding:0 12px;background:#ef4444;color:#fff;font-size:13px;border-radius:8px;flex-shrink:0;border:0;cursor:pointer}
.btn-toggle{height:34px;padding:0 10px;background:#e5e7eb;color:#333;font-size:13px;border-radius:8px;border:0;cursor:pointer}

/* 単語編集テーブル */
.word-edit-list{padding:10px 12px;border-top:1px solid #e5e7eb;background:#fff;display:flex;flex-direction:column;gap:10px}
.edit-row{display:grid;grid-template-columns:1fr 1fr 110px 36px;gap:6px;align-items:center}
.edit-input{height:38px !important;font-size:14px !important;border-radius:8px !important;padding:0 8px !important}
.edit-select{height:38px !important;font-size:13px !important;border-radius:8px !important;padding:0 4px !important;background:#fff}
.btn-icon-del{height:38px;width:36px;background:#fee2e2;color:#ef4444;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.empty-msg{font-size:14px;color:#888;text-align:center;padding:25px 0}

/* 貼り付けエリア */
.paste-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:15px}
.paste-box label{font-size:13px;font-weight:bold;color:#444;display:block;margin-bottom:6px}

@media(max-width:500px){
  .edit-row{grid-template-columns:1fr 1fr;row-gap:6px}
  .edit-row .edit-select{grid-column:span 1}
  .edit-row .btn-icon-del{grid-column:span 1;width:100%}
}
@media(max-width:380px){.jp{font-size:28px}main{padding-left:10px;padding-right:10px}.card{padding:17px 14px}}
</style>
</head>
<body>
<main>
<h1>英検対策 一問一答</h1>

<!-- ロック画面（パスワード入力画面） -->
<section class="card auth-card" id="authSection">
  <div class="auth-title">🔒 パスワード保護</div>
  <div class="auth-desc">利用するにはパスワードを入力してください。</div>
  <input type="password" id="passInput" placeholder="パスワードを入力" style="margin-bottom: 12px; text-align: center;">
  <button type="button" class="primary" id="loginBtn" style="width: 100%;">解除して始める</button>
  <div class="auth-error" id="authError"></div>
</section>

<!-- メインコンテンツ（解除成功後に表示） -->
<div id="mainContent" class="hidden">
  
  <!-- 画面切り替えタブ -->
  <nav class="tab-nav">
    <button type="button" class="tab-btn active" id="tabQuizBtn" onclick="switchPage('quizPage')">📝 クイズ</button>
    <button type="button" class="tab-btn" id="tabManageBtn" onclick="switchPage('managePage')">⚙️ データ管理</button>
  </nav>

  <!-- ページ1: クイズ画面 -->
  <div id="quizPage">
    <div class="desc">日本語と品詞を見て、英単語を入力しよう。</div>
    
    <!-- 未登録時の案内表示 -->
    <section class="card hidden" id="noWordsMsg">
      <div class="empty-msg">
        単語データがまだ登録されていません。<br>
        上部の「⚙️ データ管理」タブから単語を追加してください。
      </div>
      <button type="button" class="primary" onclick="switchPage('managePage')" style="width:100%;margin-top:10px;">データ管理を開く</button>
    </section>

    <section class="card" id="quiz">
      <div class="top"><span id="count">0 / 0</span><span id="score">正解 0</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>

      <div class="question">
        <div class="jp" id="jp">-</div>
        <div class="pos" id="pos">-</div>
      </div>

      <input id="input" type="text" inputmode="latin" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="英単語を入力">

      <div class="buttons">
        <button type="button" class="primary" id="check">答え合わせ</button>
        <button type="button" class="secondary" id="answer">答えを見る</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="stats"><span id="ok">正解 0</span><span id="ng">不正解 0</span></div>
    </section>

    <section class="card result hidden" id="result">
      <div>終了</div>
      <div class="score" id="finalScore"></div>
      <div id="rate"></div>
      <br>
      <button type="button" class="primary" id="again">もう一度挑戦</button>
    </section>
  </div>

  <!-- ページ2: データ管理画面 -->
  <div id="managePage" class="hidden">
    <!-- 出題設定エリア -->
    <section class="card" style="padding: 14px 17px; margin-bottom: 15px;">
      <div class="mode-select">
        <span>🔀 出題順序の設定:</span>
        <select id="orderSelect" onchange="start()">
          <option value="random">ランダムに出題</option>
          <option value="sequential">リスト順</option>
        </select>
      </div>
    </section>

    <!-- 単語編集・追加エリア -->
    <section class="card">
      <div class="manage-title">
        <span>📁 登録データ一覧</span>
        <span id="totalWordCount" style="font-size:13px;font-weight:normal;color:#666;">計 0 単語</span>
      </div>

      <!-- Geminiのコード貼り付け用エリア -->
      <div class="paste-box">
        <label>✨ Geminiが出力したコードを貼り付け</label>
        <input type="text" id="groupNameInput" placeholder="画像名やグループ名（例: ノート1枚目）" style="height:38px;font-size:14px;margin-bottom:8px;">
        <textarea id="pasteInput" rows="3" placeholder='ここに貼り付け'></textarea>
        <button type="button" class="primary" onclick="importFromGemini()" style="width:100%;height:40px;margin-top:8px;font-size:14px;">コードから追加する</button>
        <div id="importError" style="color:#ef4444;font-size:12px;margin-top:4px;"></div>
      </div>

      <div id="imageList" class="image-list"></div>
      <button type="button" class="secondary" onclick="addNewWord()" style="width:100%;margin-top:12px;">＋ 手動で1語追加する</button>
    </section>
  </div>

</div>
</main>

<script>
// パスワード設定・保存用キー
const PASSCODE = "1902";
const AUTH_KEY = "app_auth_passcode";
const STORAGE_GROUPS_KEY = "eiken_app_groups";
const STORAGE_WORDS_KEY = "eiken_app_words";

// データの読み込み（localStorageに保存されている場合はそれを使い、無ければ空配列）
let groups = JSON.parse(localStorage.getItem(STORAGE_GROUPS_KEY)) || [];
let words = JSON.parse(localStorage.getItem(STORAGE_WORDS_KEY)) || [];

// データをlocalStorageに保存する関数
function saveData() {
  localStorage.setItem(STORAGE_GROUPS_KEY, JSON.stringify(groups));
  localStorage.setItem(STORAGE_WORDS_KEY, JSON.stringify(words));
}

let q = [], i = 0, ok = 0, ng = 0, done = false;
const $ = id => document.getElementById(id);

function shuffle(a) { return a.slice().sort(() => Math.random() - .5); }
function norm(s) { return s.trim().toLowerCase(); }

function initAuth() {
  const savedPass = localStorage.getItem(AUTH_KEY);
  if (savedPass === PASSCODE) {
    unlockApp();
  } else {
    $("authSection").classList.remove("hidden");
    $("mainContent").classList.add("hidden");
  }
}

function unlockApp() {
  $("authSection").classList.add("hidden");
  $("mainContent").classList.remove("hidden");
  start();
}

function checkPassword() {
  const inputVal = $("passInput").value;
  if (inputVal === PASSCODE) {
    localStorage.setItem(AUTH_KEY, PASSCODE);
    unlockApp();
  } else {
    $("authError").textContent = "パスワードが違います。";
    $("passInput").value = "";
    $("passInput").focus();
  }
}

// ページ切り替え関数
function switchPage(pageId) {
  if (pageId === 'quizPage') {
    $("quizPage").classList.remove("hidden");
    $("managePage").classList.add("hidden");
    $("tabQuizBtn").classList.add("active");
    $("tabManageBtn").classList.remove("active");
  } else {
    $("quizPage").classList.add("hidden");
    $("managePage").classList.remove("hidden");
    $("tabQuizBtn").classList.remove("active");
    $("tabManageBtn").classList.add("active");
    updateManageUI();
  }
}

function start() {
  if (words.length === 0) {
    $("quiz").classList.add("hidden");
    $("result").classList.add("hidden");
    $("noWordsMsg").classList.remove("hidden");
    updateManageUI();
    return;
  }

  $("noWordsMsg").classList.add("hidden");

  const orderMode = $("orderSelect").value;
  if (orderMode === "random") {
    q = shuffle(words);
  } else {
    q = words.slice();
  }

  i = 0; ok = 0; ng = 0;
  $("quiz").classList.remove("hidden");
  $("result").classList.add("hidden");
  show();
  updateManageUI();
}

function show() {
  done = false;
  const w = q[i];
  $("count").textContent = (i + 1) + " / " + q.length;
  $("fill").style.width = (i / q.length * 100) + "%";
  $("jp").textContent = w.jp;
  $("pos").textContent = w.pos;
  $("input").value = "";
  $("input").disabled = false;
  $("feedback").className = "feedback";
  $("feedback").innerHTML = "";
  $("check").textContent = "答え合わせ";
  $("answer").textContent = "答えを見る";
  $("input").focus();
  $("ok").textContent = "正解 " + ok;
  $("ng").textContent = "不正解 " + ng;
  $("score").textContent = "正解 " + ok;
}

function next() {
  i++;
  if (i >= q.length) finish();
  else show();
}

function judge() {
  if (done) { next(); return; }
  const val = $("input").value;
  if (!val.trim()) {
    $("feedback").className = "feedback bad";
    $("feedback").innerHTML = "単語を入力してください。";
    return;
  }
  done = true;
  const right = norm(val) === norm(q[i].en);
  if (right) {
    ok++;
    $("feedback").className = "feedback good";
    $("feedback").innerHTML = "正解！<br><span class='answer'>" + q[i].en + "</span>";
  } else {
    ng++;
    $("feedback").className = "feedback bad";
    $("feedback").innerHTML = "不正解。正解は<br><span class='answer'>" + q[i].en + "</span>";
  }
  $("input").disabled = true;
  $("check").textContent = "次の問題";
  $("answer").textContent = "次の問題";
  $("ok").textContent = "正解 " + ok;
  $("ng").textContent = "不正解 " + ng;
  $("score").textContent = "正解 " + ok;
}

function reveal() {
  if (done) { next(); return; }
  done = true;
  ng++;
  $("feedback").className = "feedback bad";
  $("feedback").innerHTML = "正解：<span class='answer'>" + q[i].en + "</span>";
  $("input").disabled = true;
  $("check").textContent = "次の問題";
  $("answer").textContent = "次の問題";
  $("ok").textContent = "正解 " + ok;
  $("ng").textContent = "不正解 " + ng;
  $("score").textContent = "正解 " + ok;
}

function finish() {
  $("fill").style.width = "100%";
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("finalScore").textContent = ok + " / " + q.length;
  $("rate").textContent = "正答率 " + Math.round(ok / q.length * 100) + "%";
}

function deleteSingleWord(wordId) {
  words = words.filter(w => w.id !== wordId);
  saveData(); // 保存
  start();
}

function deleteGroup(groupId) {
  if (confirm("この画像に登録されているすべての単語を削除しますか？")) {
    words = words.filter(w => w.groupId !== groupId);
    groups = groups.filter(g => g.id !== groupId);
    saveData(); // 保存
    start();
  }
}

function toggleAccordion(groupId) {
  const g = groups.find(item => item.id === groupId);
  if (g) {
    g.open = !g.open;
    saveData(); // アコーディオンの開閉状態も保存
    updateManageUI();
  }
}

function updateWordField(wordId, field, value) {
  const w = words.find(item => item.id === wordId);
  if (w) {
    w[field] = value.trim();
    saveData(); // 保存
    if (q[i] && q[i].id === wordId) {
      if (field === 'jp') $("jp").textContent = w.jp;
      if (field === 'pos') $("pos").textContent = w.pos;
    }
  }
}

function addNewWord() {
  let defaultGroup = groups[0];
  if (!defaultGroup) {
    defaultGroup = { id: "g_" + Date.now(), name: "新規グループ", open: true };
    groups.push(defaultGroup);
  }

  const newId = "w_" + Date.now();
  words.unshift({
    id: newId,
    groupId: defaultGroup.id,
    en: "newword",
    pos: "名詞 (n.)",
    jp: "新しい単語"
  });
  saveData(); // 保存
  start();
}

function importFromGemini() {
  const text = $("pasteInput").value.trim();
  let groupName = $("groupNameInput").value.trim();
  $("importError").textContent = "";
  
  if (!text) return;
  if (!groupName) groupName = "画像 " + (groups.length + 1);

  try {
    const parsed = new Function(`return ${text}`)();
    if (Array.isArray(parsed)) {
      const newGroupId = "g_" + Date.now();
      
      groups.push({
        id: newGroupId,
        name: groupName,
        open: true
      });

      const newItems = parsed.map((item, idx) => ({
        id: "w_g_" + Date.now() + "_" + idx,
        groupId: newGroupId,
        en: item.en || "",
        pos: item.pos || "名詞 (n.)",
        jp: item.jp || ""
      }));

      words = words.concat(newItems);
      saveData(); // 保存
      
      $("pasteInput").value = "";
      $("groupNameInput").value = "";
      start();
    } else {
      $("importError").textContent = "配列フォーマット形式で貼り付けてください。";
    }
  } catch (err) {
    $("importError").textContent = "コードの解析に失敗しました。フォーマットを確認してください。";
  }
}

function updateManageUI() {
  $("totalWordCount").textContent = `計 ${words.length} 単語`;
  const listEl = $("imageList");
  listEl.innerHTML = "";

  if (groups.length === 0) {
    listEl.innerHTML = `<div class="empty-msg">登録されている画像データはありません</div>`;
    return;
  }

  groups.forEach(g => {
    const groupWords = words.filter(w => w.groupId === g.id);
    const card = document.createElement("div");
    card.className = "image-card";

    const header = document.createElement("div");
    header.className = "image-header";
    header.innerHTML = `
      <div class="image-info" onclick="toggleAccordion('${g.id}')">
        <div class="image-name">📷 ${g.name}</div>
        <div class="image-meta">${groupWords.length} 単語</div>
      </div>
      <div class="action-btns">
        <button type="button" class="btn-toggle" onclick="toggleAccordion('${g.id}')">${g.open ? '閉じる' : '編集'}</button>
        <button type="button" class="btn-del" onclick="deleteGroup('${g.id}')">削除</button>
      </div>
    `;
    card.appendChild(header);

    if (g.open) {
      const editList = document.createElement("div");
      editList.className = "word-edit-list";

      if (groupWords.length === 0) {
        editList.innerHTML = `<div class="empty-msg">この画像に単語はありません</div>`;
      } else {
        groupWords.forEach(w => {
          const row = document.createElement("div");
          row.className = "edit-row";
          row.innerHTML = `
            <input type="text" class="edit-input" value="${w.en}" placeholder="英単語" onchange="updateWordField('${w.id}', 'en', this.value)">
            <input type="text" class="edit-input" value="${w.jp}" placeholder="日本語" onchange="updateWordField('${w.id}', 'jp', this.value)">
            <select class="edit-select" onchange="updateWordField('${w.id}', 'pos', this.value)">
              <option value="名詞 (n.)" ${w.pos.includes('名詞') ? 'selected' : ''}>名詞 (n.)</option>
              <option value="動詞 (v.)" ${w.pos.includes('動詞') ? 'selected' : ''}>動詞 (v.)</option>
              <option value="形容詞 (a.)" ${w.pos.includes('形容詞') ? 'selected' : ''}>形容詞 (a.)</option>
              <option value="副詞 (ad.)" ${w.pos.includes('副詞') ? 'selected' : ''}>副詞 (ad.)</option>
            </select>
            <button type="button" class="btn-icon-del" title="削除" onclick="deleteSingleWord('${w.id}')">✕</button>
          `;
          editList.appendChild(row);
        });
      }
      card.appendChild(editList);
    }

    listEl.appendChild(card);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  initAuth();

  $("loginBtn").addEventListener("click", checkPassword);
  $("passInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.keyCode === 13) checkPassword();
  });

  $("check").addEventListener("click", judge);
  $("answer").addEventListener("click", reveal);
  $("again").addEventListener("click", start);
  
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.keyCode === 13) judge();
  });
});
</script>
</body>
</html>
