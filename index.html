<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細設定 - 修正サンプル</title>
  
  <!-- Font Awesome（歯車アイコン用） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ---------------------------------------------
       1. 基本スタイル設定
    --------------------------------------------- */
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }

    .settings-container {
      background: #ffffff;
      padding: 16px 24px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ---------------------------------------------
       2. 歯車アイコン＆設定ボタンの修正CSS
    --------------------------------------------- */
    .settings-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #333333;
      font-size: 16px;
      font-weight: bold;
      
      /* 【原因対策①】リンクや親要素の下線をすべて完全に消去 */
      text-decoration: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
      outline: none;
    }

    /* アイコン自体に付与されている可能性がある下線を消去 */
    .settings-link i,
    .settings-link svg {
      text-decoration: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
      display: inline-block;
    }

    /* 【原因対策②】CSS擬似要素でのアイコン重複をクリア */
    /* ※HTMLで<i>タグを書いている場合、:before / :after での二重描画を防ぎます */
    .settings-link::before,
    .settings-link::after {
      content: none !important; /* 擬似要素によるアイコン生成を無効化 */
    }

    /* ホバー時の装飾（必要に応じて調整） */
    .settings-link:hover {
      color: #0066cc;
      text-decoration: none !important; /* ホバー時も下線を表示させない */
    }
  </style>
</head>
<body>

  <div class="settings-container">
    <!-- 
      【ポイント】
      - 歯車アイコン（<i class="fa-solid fa-gear"></i>）は1個のみ配置します。
      - <a> タグ内の下線はCSSでクリアしています。
    -->
    <a href="#advanced-settings" class="settings-link" id="settingsBtn">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
      <span>詳細設定</span>
    </a>
  </div>

  <script>
    // ---------------------------------------------
    // 3. JavaScript（アイコン重複の自動チェック・防止処理）
    // ---------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const settingsLink = document.getElementById("settingsBtn");

      if (settingsLink) {
        // 万が一、JSや外部ライブラリによってアイコン要素が複数挿入された場合の安全策
        const icons = settingsLink.querySelectorAll("i, svg");
        if (icons.length > 1) {
          // 2つ目以降のアイコン要素を自動的に削除
          for (let i = 1; i < icons.length; i++) {
            icons[i].remove();
          }
        }
      }
    });
  </script>

</body>
</html>
